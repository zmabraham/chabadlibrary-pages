<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chabad Library Wiki</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background: #F5F1E8;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            background: #E8E4DA;
            border-right: 1px solid #d0c8bc;
            overflow-y: auto;
            max-height: 100vh;
        }
        .main {
            padding: 2rem;
            overflow-y: auto;
            max-height: 100vh;
        }
        .header {
            padding: 1.5rem;
            border-bottom: 1px solid #d0c8bc;
            background: #8B2635;
            color: white;
        }
        .header h1 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .stats {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .category {
            margin-bottom: 0.5rem;
        }
        .category-title {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .category-title:hover {
            background: rgba(139, 38, 53, 0.1);
        }
        .category-title::after {
            content: '▶';
            font-size: 0.7rem;
            transition: transform 0.2s;
        }
        .category.open .category-title::after {
            transform: rotate(90deg);
        }
        .books {
            display: none;
            padding-left: 1rem;
        }
        .category.open .books {
            display: block;
        }
        .book {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-left: 2px solid transparent;
            transition: all 0.2s;
        }
        .book:hover {
            background: rgba(139, 38, 53, 0.05);
            border-left-color: #8B2635;
        }
        .book.selected {
            background: rgba(139, 38, 53, 0.15);
            border-left-color: #8B2635;
        }
        .book-title {
            font-weight: 500;
        }
        .book-meta {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
        }
        .content h2 {
            color: #8B2635;
            margin-bottom: 1rem;
        }
        .content p {
            margin-bottom: 1rem;
        }
        .hebrew {
            font-size: 1.2rem;
            direction: rtl;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #8a8a8a;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>

        <aside class="sidebar">
            <div class="header">
                <h1>📚 Chabad Library Wiki</h1>
                <div class="stats" id="stats">Loading...</div>
            </div>
            <div id="tree"></div>
        </aside>
        <main class="main">
            <div class="content" id="content">
                <div class="empty-state">
                    <h2>Welcome to the Chabad Library Wiki</h2>
                    <p>Select a book from the sidebar to view its contents.</p>
                </div>
            </div>
        </main>
    </div>

            {

                books: []

        let totalBooks = 0;
        let scrapedPages = 2812;

        function init() {
            renderTree();
            updateStats();
        }

        function renderTree() {
            const tree = document.getElementById('tree');

            hierarchy.forEach(category => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `<span>${category.title}</span><small>${category.titleEn}</small>`;
                titleDiv.onclick = () => {
                    catDiv.classList.toggle('open');
                };

                const booksDiv = document.createElement('div');
                booksDiv.className = 'books';

                if (category.books.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'book';
                    empty.style.color = '#999';
                    empty.textContent = 'No sub-books';
                    booksDiv.appendChild(empty);
                } else {
                    category.books.forEach(book => {
                        totalBooks++;
                        const bookDiv = document.createElement('div');
                        bookDiv.className = 'book';
                        bookDiv.innerHTML = `
                            <div class="book-title">${book.title}</div>
                            <div class="book-meta">${book.titleEn}</div>
                        `;
                        bookDiv.onclick = (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.book').forEach(b => b.classList.remove('selected'));
                            bookDiv.classList.add('selected');
                            showBook(book, category);
                        };
                        booksDiv.appendChild(bookDiv);
                    });
                }

                catDiv.appendChild(titleDiv);
                catDiv.appendChild(booksDiv);
                tree.appendChild(catDiv);
            });
        }

        function showBook(book, category) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2 class="hebrew">${book.title}</h2>
                <p><strong>${book.titleEn}</strong></p>
                <p>Category: ${category.title} (${category.titleEn})</p>
                <p>Book ID: ${book.id}</p>
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #d0c8bc;">
                <p><a href="https://chabadlibrary.org/books/${book.id}" target="_blank" style="color: #8B2635;">View on Chabad Library →</a></p>
                <p style="margin-top: 2rem; color: #8a8a8a;">Content will be available once scraping completes.</p>
            `;
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            stats.textContent = `${totalBooks} books • ${scrapedPages} pages scraped • 11 categories`;
        }

        init();
    </script>

</html>
